name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches the package version
        run: |
          version=$(node -p "require('./uni_modules/antdv-next-uni/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != package version v$version" >&2
            exit 1
          fi
      - name: Build the plugin archive
        run: |
          node tools/release.mjs
          node tools/release.mjs --notes > "$RUNNER_TEMP/notes.md"
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
